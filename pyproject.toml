[project]
name = "weeb-dl"
version = "1.0.0"
description = "A tool to download manga/manhwa/manhua from weebcentral.com"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "tristan-harris" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "notify-py>=0.3.43",
    "pikepdf>=10.7.2",
    "platformdirs>=4.10.0",
    "requests>=2.34.2",
    "ttkbootstrap>=1.20.3",
]

[project.scripts]
weebdl-cli = "weeb_dl.cli:main"

[project.gui-scripts]
weebdl-gui = "weeb_dl.gui:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

# ignore linter warnings related to '*' imports
[tool.ruff.lint]
ignore = ["F403", "F405"]
